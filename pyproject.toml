[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tr-speech-eval"
version = "0.0.1"
description = "Evaluation harness for Turkish speech systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "omstechops", email = "325673804+omstechops@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Natural Language :: Turkish",
    "Typing :: Typed",
]
# Standard library only, deliberately. The blinding and manifest modules are
# the reusable part of this package and must not drag a platform-specific
# machine-learning stack in behind them.
dependencies = []

[project.optional-dependencies]
# Running the two post-editing systems.
api = ["anthropic>=1,<2"]
# Producing the raw ASR transcripts. Apple Silicon only; this is why it is not
# a core dependency.
asr = ["mlx-whisper"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tr_speech_eval"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "D", "ANN", "RUF"]
ignore = [
    "D107",
    "ANN401",
    # Turkish text is this package's subject matter; "ı" and "İ" are not
    # ambiguous here, they are the data.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103", "ANN001", "ANN201"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
